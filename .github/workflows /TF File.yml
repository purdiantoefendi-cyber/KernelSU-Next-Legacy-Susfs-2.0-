name: Sync Missing Files Between Repositories

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repository asal (format: owner/repo, misal: octocat/Hello-World)'
        required: true
      source_branch:
        description: 'Branch asal di repo lain (misal: main)'
        required: true
        default: 'main'
      target_branch:
        description: 'Branch tujuan di repo ini (misal: custom-2)'
        required: true
        default: 'custom-2'

jobs:
  transfer-missing-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch }}

      - name: Copy Missing Files from Source Repo
        run: |
          SOURCE_REPO="${{ github.event.inputs.source_repo }}"
          SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
          TARGET_BRANCH="${{ github.event.inputs.target_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Tambahkan remote untuk repo asal (Gunakan HTTPS)
          # Catatan: Jika repo asal bersifat PRIVATE, lihat panduan di bawah
          git remote add source-remote "https://github.com/$SOURCE_REPO.git"
          
          # 2. Fetch branch asal dari repo lain
          git fetch source-remote $SOURCE_BRANCH

          # 3. Loop semua file dari branch asal menggunakan FETCH_HEAD
          git ls-tree -r --name-only FETCH_HEAD | while IFS= read -r file; do
            # Cek apakah file tidak ada di repo/branch saat ini
            if [ ! -e "$file" ]; then
              echo "Menyalin file baru: $file"
              mkdir -p "$(dirname "$file")"
              git checkout FETCH_HEAD -- "$file"
            fi
          done

          # 4. Commit dan push hanya jika ada file baru yang disalin
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "ci: transfer file baru dari $SOURCE_REPO ($SOURCE_BRANCH) ke $TARGET_BRANCH"
            git push origin $TARGET_BRANCH
            echo "Proses selesai: File baru berhasil ditransfer dan di-push ke branch $TARGET_BRANCH."
          else
            echo "Selesai: Tidak ada file baru yang perlu ditransfer. Semua file sudah ada."
          fi
